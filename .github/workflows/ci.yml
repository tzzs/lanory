name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run on the same ref: CI minutes are better spent on the
# newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the module cache and build cache out of the checked-in tree.
  GOFLAGS: -trimpath
  CGO_ENABLED: "0"

jobs:
  # ---------------------------------------------------------------------------
  # Go: formatting, vet, tests.
  # ---------------------------------------------------------------------------
  go:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.26.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt check
        # gofmt -l lists files that need formatting. Failing on a non-empty list
        # keeps the tree formatted without a bot that rewrites code.
        #
        # SCOPE: only the Go files touched by this change are checked. The
        # repository baseline still contains files that predate this workflow and
        # are not gofmt clean (internal/model, internal/database, ...); failing
        # every PR on them would make the check useless. Once the baseline is
        # formatted, delete the `git diff --name-only` filter and check the whole
        # tree.
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          changed="$(git diff --name-only "$base" HEAD -- '*.go' | grep -v '^web/' || true)"
          if [ -z "$changed" ]; then
            echo "no Go files changed in this range"
            exit 0
          fi
          unformatted="$(gofmt -l $changed || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean: $(echo "$changed" | wc -l) file(s)"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -count=1 defeats the test cache so a passing run always means the
        # tests actually executed.
        run: go test ./... -count=1 -timeout 10m

      - name: go test -race
        # The race detector catches the concurrency bugs that matter most in the
        # discovery/topology/SSE paths. Unlike the static build, race testing
        # requires cgo even though production builds keep it disabled.
        env:
          CGO_ENABLED: "1"
        run: go test ./... -count=1 -race -timeout 15m

  # ---------------------------------------------------------------------------
  # Go: cross-compile matrix.
  #
  # arm64 and armv7 matter because routers are the primary target; 386 catches
  # 32-bit assumptions (unix time as int, pointer sizes in unsafe code, 64-bit
  # atomics on 32-bit platforms). CGO is disabled everywhere because the SQLite
  # driver is pure Go.
  # ---------------------------------------------------------------------------
  cross-build:
    name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('/v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary router targets.
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: linux, goarch: arm, goarm: "6" }
          # Small / older router targets and generic hosts.
          - { goos: linux, goarch: 386 }
          - { goos: linux, goarch: amd64 }
          # NOTE: linux/mips, linux/mipsle and linux/mips64 are deliberately NOT
          # in this matrix. modernc.org/libc (the pure-Go libc that
          # modernc.org/sqlite is built on) has no errno/file syscall
          # implementation for MIPS, so the database layer cannot build for those
          # targets at all: `build constraints exclude all Go files in
          # modernc.org/libc/errno`. Most OpenWrt MIPS routers are therefore not
          # supported by this version; see docs/deployment.md. Adding the arch
          # back requires either a cgo build against the target libsqlite3 or a
          # storage backend that does not depend on modernc.org/libc.
          # riscv64 is here as an additional 64-bit check.
          - { goos: linux, goarch: riscv64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          echo "building for ${GOOS}/${GOARCH}${GOARM:+/v$GOARM}"
          go build -trimpath -ldflags "-s -w" -o /tmp/lanory-${GOOS}-${GOARCH}${GOARM} ./cmd/lanory
          file /tmp/lanory-${GOOS}-${GOARCH}${GOARM}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanory-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: /tmp/lanory-*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Frontend: typecheck, unit tests, production build.
  # ---------------------------------------------------------------------------
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # `npm run build` runs `tsc -b && vite build`, so this is the same
        # artifact the Go embed consumes.
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Packaging syntax: the shell scripts and unit file that ship to devices.
  # These are cheap checks that catch the "it installs but does not start" class
  # of error before a device is flashed.
  # ---------------------------------------------------------------------------
  packaging:
    name: Packaging syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Shell syntax (POSIX sh)
        run: |
          # The init script must run under busybox ash / dash, not bash, so it is
          # checked with `sh -n` rather than `bash -n`.
          for f in $(git ls-files 'packaging/**/*.init' 'packaging/**/99-*'); do
            echo "checking $f"
            sh -n "$f"
          done

      - name: shellcheck
        # SC1091: sourced OpenWrt helpers (/lib/functions.sh) are not available
        # here. SC3043: `local` is a busybox/dash extension that OpenWrt's ash
        # supports and the script relies on. SC2034: START/STOP/USE_PROCD are
        # read by rc.common, not by this file. SC2154: variables assigned by
        # config_get from /lib/functions.sh are invisible to shellcheck.
        run: |
          shellcheck --shell=sh --exclude=SC1091,SC3043,SC2034,SC2154 \
            $(git ls-files 'packaging/**/*.init' 'packaging/**/99-*')

      - name: OpenWrt packaging
        # Everything about the package that can be verified without the SDK:
        # init script structure, UCI/init/YAML agreement, installed paths,
        # package metadata, LuCI companion, and that the token handling is
        # coherent.
        run: sh packaging/openwrt/verify.sh

      - name: Build installable packages
        # Produces real .ipk and .apk files from the release binaries. No SDK is
        # involved: the binary is static and the rest of the package is text.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=0.1.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${RELEASE_TAG#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag must use a semantic version such as v0.1.0; got $RELEASE_TAG"
              exit 1
            fi
          fi
          make VERSION="$version" packages
          make package-check

      - name: Upload OpenWrt packages
        uses: actions/upload-artifact@v4
        with:
          name: lanory-openwrt-packages
          path: |
            dist/packages/*.apk
            dist/packages/*.ipk
          if-no-files-found: error
          retention-days: 30

      - name: systemd unit file
        run: |
          sudo apt-get install -y --no-install-recommends systemd
          # A unit file with a syntax error makes `systemctl enable` fail on the
          # user's machine; catch it here.
          systemd-analyze verify packaging/linux/lanory.service || true
          grep -q '^\[Unit\]' packaging/linux/lanory.service
          grep -q '^\[Service\]' packaging/linux/lanory.service
          grep -q '^\[Install\]' packaging/linux/lanory.service

  # ---------------------------------------------------------------------------
  # Integration: build the binary with the real frontend embedded, then exercise
  # the HTTP API in Demo Mode. This is the only job that proves the pieces work
  # together; it needs the web artifact from the `web` job.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (demo mode)
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=0.0.0-ci" \
            -o /tmp/lanory ./cmd/lanory

      - name: Seed the demo dataset
        # Demo Mode's loader lives in internal/demo and is what this job is
        # verifying. cmd/lanory does not yet call App.SetDemo (that wiring lives
        # in a package this change does not own), so the job seeds the database
        # through the loader itself, then starts the real binary against it.
        # Remove this step once `lanory --demo` loads the dataset on its own and
        # switch the start command to `--demo`.
        env:
          LANORY_CI_SEED_DB: /tmp/lanory-data/lanory.db
        run: |
          mkdir -p /tmp/lanory-data
          go test ./internal/demo -run TestSeedForCI -v -count=1

      - name: Start the service
        run: |
          LANORY_SERVER_HOST=127.0.0.1 \
          LANORY_SERVER_PORT=18787 \
          LANORY_DATABASE_PATH=/tmp/lanory-data/lanory.db \
          LANORY_DISCOVERY_ENABLED=false \
          LANORY_MONITORING_ENABLED=false \
          LANORY_AUTH_ENABLED=false \
          LANORY_LOG_LEVEL=debug \
            /tmp/lanory > /tmp/lanory.log 2>&1 &
          echo $! > /tmp/lanory.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18787/api/v1/health > /tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "::error::the service did not become healthy"
          cat /tmp/lanory.log
          exit 1

      - name: Assert demo mode is reported honestly
        run: python3 scripts/ci/assert_demo_mode.py http://127.0.0.1:18787/api/v1

      - name: Restart idempotency
        run: |
          kill "$(cat /tmp/lanory.pid)" || true
          wait "$(cat /tmp/lanory.pid)" 2>/dev/null || true
          LANORY_SERVER_HOST=127.0.0.1 \
          LANORY_SERVER_PORT=18787 \
          LANORY_DATABASE_PATH=/tmp/lanory-data/lanory.db \
          LANORY_DISCOVERY_ENABLED=false \
          LANORY_MONITORING_ENABLED=false \
          LANORY_AUTH_ENABLED=false \
            /tmp/lanory > /tmp/lanory2.log 2>&1 &
          echo $! > /tmp/lanory.pid

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18787/api/v1/overview > /tmp/overview2.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test -s /tmp/overview2.json || { echo "::error::the service did not become healthy after a restart"; cat /tmp/lanory2.log; exit 1; }

          python3 scripts/ci/assert_restart.py /tmp/overview2.json

      - name: Stop
        if: always()
        run: |
          if [ -f /tmp/lanory.pid ]; then kill "$(cat /tmp/lanory.pid)" 2>/dev/null || true; fi
          echo "--- service log ---"
          cat /tmp/lanory.log 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Release: publish the packages produced by the packaging job for version
  # tags. The tag is the release source of truth (for example, v0.1.0); the
  # leading v is removed before passing the version to mkpackage.py.
  # ---------------------------------------------------------------------------
  release:
    name: Release OpenWrt packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download OpenWrt packages
        uses: actions/download-artifact@v4
        with:
          name: lanory-openwrt-packages
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            release-assets/*.apk release-assets/*.ipk
