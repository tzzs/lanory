# Lanory container configuration.
#
# Mounted at /etc/lanory/config.yaml. Every value can be overridden with a
# LANORY_* environment variable, which wins over this file (see
# docs/deployment.md).

server:
  host: "0.0.0.0"
  port: 8787
  base_path: ""

database:
  # Inside the container this must be on the mounted volume, or the data is lost
  # when the container is replaced.
  path: "/var/lib/lanory/lanory.db"
  retention_days: 30

discovery:
  enabled: true
  interval: "10m"
  auto_detect_subnets: true
  max_concurrency: 16
  # Authorised extra CIDRs. Required in bridge network mode: the container
  # cannot see the LAN link, so it needs an explicit target list to scan.
  subnets: []
  scan_timeout: "500ms"
  rate_limit: 64

collectors:
  openwrt: true
  arp: true
  ndp: true
  dhcp: true
  fdb: true
  lldp: false
  mdns: false
  ssdp: false
  snmp: false
  scan: false

monitoring:
  enabled: true
  interval: "60s"
  timeout: "3s"
  failure_threshold: 3
  recover_confirm: 1
  interface_refresh: "30s"
  device_refresh: "60s"

topology:
  auto_layout: true
  preserve_manual_layout: true
  prefer_confirmed_edges: true
  unverified_edge_threshold: 0.6

auth:
  enabled: false
  allow_lan: true
  token: ""
  token_file: ""

logging:
  level: "info"
  pretty: true

demo:
  # Set LANORY_DEMO_MODE=true (or enable this) to explore the UI with the
  # built-in sample network instead of the host's real one.
  enabled: false
  seed: "easepi-r1"
