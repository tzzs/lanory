# Lanory — docker compose
#
# Two services are defined on purpose:
#
#   lanory           bridge network (default). Reduced discovery: the container
#                    cannot see the host's layer 2 domain, so ARP, the bridge
#                    forwarding database, mDNS and SSDP are all blind. Use this
#                    with an explicit `discovery.subnets` list of hosts to probe.
#
#   lanory-hostnet  host network. Full layer-2 discovery. This is the only mode
#                    in which the FDB / ARP / mDNS collectors see real data.
#
# Start one of them, not both:
#   docker compose up -d lanory-hostnet
#   docker compose --profile bridge up -d lanory
#
# Docker is OPTIONAL. On the router, install the native package instead
# (packaging/openwrt); that deployment sees the real bridge and is the supported
# production path.

services:
  # ---------------------------------------------------------------------
  # Host network: full discovery.
  # ---------------------------------------------------------------------
  lanory-hostnet:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
      args:
        VERSION: "0.1.0"
    image: lanory:0.1.0
    container_name: lanory
    # Host networking is required for ARP/FDB/mDNS visibility. On Linux only.
    network_mode: host
    restart: unless-stopped
    read_only: true
    # /var/lib/lanory is the only writable path; /tmp is needed by the Go runtime
    # for temporary SQLite files.
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - lanory-data:/var/lib/lanory
    environment:
      # Host mode still needs to know where the data lives.
      LANORY_DATABASE_PATH: /var/lib/lanory/lanory.db
      LANORY_LOG_LEVEL: info
      # Auth: leave the UI on the LAN only. To expose it, set a token:
      # LANORY_AUTH_ENABLED: "true"
      # LANORY_AUTH_TOKEN: "${LANORY_AUTH_TOKEN:?set LANORY_AUTH_TOKEN}"
    # No `ports:` in host mode: the process binds 8787 on the host directly.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Note: cap_drop ALL still allows reading /proc and /sys, which is what the
    # passive collectors use. Raw sockets for ICMP need CAP_NET_RAW:
    cap_add:
      - NET_RAW
    stop_grace_period: 20s

  # ---------------------------------------------------------------------
  # Bridge network: reduced discovery, explicit targets only.
  # ---------------------------------------------------------------------
  lanory:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
      args:
        VERSION: "0.1.0"
    image: lanory:0.1.0
    container_name: lanory-bridge
    profiles: ["bridge"]
    # The default bridge network. NO layer-2 visibility:
    #   - `bridge fdb show` only shows the container's own veth;
    #   - ARP/NDP only show the container's neighbours on the docker network;
    #   - multicast (mDNS/SSDP) does not cross the bridge by default.
    # Discovery therefore degrades to: explicit subnets + explicit probes.
    network_mode: bridge
    ports:
      - "8787:8787"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - lanory-data:/var/lib/lanory
      # Provide a config that lists the subnets you authorise Lanory to look at:
      # - ./config.yaml:/etc/lanory/config.yaml:ro
    environment:
      LANORY_DATABASE_PATH: /var/lib/lanory/lanory.db
      # In bridge mode an honest configuration is mandatory: without a target
      # list Lanory will correctly find nothing.
      LANORY_DISCOVERY_AUTO_DETECT_SUBNETS: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    stop_grace_period: 20s

volumes:
  lanory-data:
    driver: local
